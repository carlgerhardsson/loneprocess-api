name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Firebase tests
      run: |
        echo "🧪 Running Firebase backend tests..."
        python -c "import firebase_admin; print('✅ Firebase Admin SDK installed')"
        python -c "import fastapi; print('✅ FastAPI installed')"
        python -c "from firebase_adapter import FirestoreAdapter; print('✅ FirestoreAdapter imports successfully')"
        python -c "from models import *; print('✅ All models import successfully')"
        echo "✅ All imports successful!"
    
    - name: Validate configuration
      run: |
        echo "🔍 Validating Firebase configuration..."
        python -c "from config import get_db, initialize_firebase; print('✅ Config imports successfully')"
        echo "✅ Configuration valid!"
    
    - name: Test summary
      run: |
        echo "🎉 All tests passed!"
        echo "Backend: Firestore (Firebase)"
        echo "Framework: FastAPI"
        echo "Python: 3.11"
