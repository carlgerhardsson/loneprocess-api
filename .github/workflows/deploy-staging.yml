name: Deploy to Firebase Staging

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-firebase.txt
    
    - name: Run tests (placeholder)
      run: |
        echo "Running tests..."
        python -c "import firebase_admin; print('✅ Firebase Admin SDK installed')"
        python -c "import fastapi; print('✅ FastAPI installed')"
        python -c "from firebase_adapter import FirestoreAdapter; print('✅ Adapter imports successfully')"
    
    - name: Deploy to Firebase
      uses: w9jds/firebase-action@master
      with:
        args: deploy --only firestore:rules,firestore:indexes
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        PROJECT_ID: loneprocess-api-staging
    
    - name: Deployment summary
      run: |
        echo "🔥 Deployed to Firebase Staging!"
        echo "📊 Firestore Rules: Updated"
        echo "📊 Firestore Indexes: Updated"
        echo "🌐 Project: loneprocess-api-staging"
